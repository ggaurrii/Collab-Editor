x-realtime: &realtime
  build: .
  profiles: ["app"]
  command: npm run dev -w apps/realtime
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  realtime-1:
    <<: *realtime
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://collab:collab@postgres:5432/collab
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
    ports: ["4000:4000"]

  realtime-2:
    <<: *realtime
    environment:
      PORT: "4001"
      DATABASE_URL: postgres://collab:collab@postgres:5432/collab
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
    ports: ["4001:4001"]

  web:
    build: .
    profiles: ["app"]
    command: npm run dev -w apps/web -- -H 0.0.0.0
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://collab:collab@postgres:5432/collab
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      NEXT_PUBLIC_WS_URLS: ws://localhost:4000,ws://localhost:4001
    ports: ["3000:3000"]

volumes:
  pgdata:
